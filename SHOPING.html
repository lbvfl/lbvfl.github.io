
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СПИСОК ПОКУПОК</title>
<style>
body {
    font-family: sans-serif;
    max-width: 500px;
    margin: 20px auto;
    padding: 10px;
    background: #f9f9f9;
}

* {
    text-transform: uppercase;
    box-sizing: border-box;
}

input, textarea, button {
    font-family: inherit;
}

.tabs {
    display: flex;
    margin-bottom: 15px;
    gap: 5px;
}

.tab-btn {
    flex: 1;
    padding: 12px;
    background: #e0e0e0;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.tab-btn.active {
    background: #007bff;
    color: white;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.btn-clear {
    width: 100%;
    padding: 10px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 20px;
    cursor: pointer;
}

.section-divider {
    border: 0;
    height: 4px;
    background: #333;
    margin: 15px 0;
}

.product {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.product input[type="checkbox"] {
    width: 24px;
    height: 24px;
    margin-right: 12px;
    cursor: pointer;
    flex-shrink: 0;
}

.product-name {
    flex: 1;
    min-width: 0;
}

.product-extra {
    width: 76px;
    min-width: 76px;
    max-width: 76px;
    height: 32px;
    margin-left: 8px;
    padding: 4px;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-size: 13px;
    font-weight: normal;
    text-align: center;
    background: #fff;
}

.add-custom {
    display: flex;
    margin-top: 15px;
    margin-bottom: 5px;
    gap: 5px;
}

.add-custom input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.add-custom button {
    padding: 10px 15px;
    font-size: 16px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
}

.send-panel {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.btn-send, .btn-telegram {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.btn-send {
    background: #6c757d;
}

.btn-telegram {
    background: #007bff;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

textarea {
    width: 100%;
    height: 250px;
    padding: 12px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 4px;
    resize: vertical;
    font-weight: bold;
}

.tg-input {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    margin-bottom: 10px;
}

.btn-save {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

.hint {
    font-size: 14px;
    color: #333;
    margin-bottom: 10px;
    font-weight: bold;
}


/* ОКРЕМА СТОРІНКА СПИСКУ, ЯКУ ВІДКРИВАЮТЬ НА ТЕЛЕФОНІ */
#sharedListPage { display:none; }
body.shared-view { margin:0; padding:0; max-width:none; min-height:100vh; background:#f9f9f9; }
body.shared-view > *:not(#sharedListPage) { display:none !important; }
body.shared-view #sharedListPage {
    display:flex; flex-direction:column; min-height:100vh; width:100%;
    padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
    background:#f9f9f9; color:#222;
}
#sharedListPage h1 { text-align:center; font-size:27px; font-weight:800; margin:4px 0 18px; }
#sharedListContent { flex:1; white-space:pre-wrap; overflow-wrap:anywhere; font-size:40px; line-height:1.55; font-weight:700; text-transform:uppercase; }
#sharedListPage button { width:100%; padding:15px; margin-top:14px; border:0; border-radius:8px; color:white; background:#007bff; font-size:19px; font-weight:800; }



/* КОМПАКТНИЙ ВИГЛЯД ЗАСТОСУНКУ НА КОМП’ЮТЕРІ; ТЕЛЕФОН НЕ ЗМІНЮЄТЬСЯ */
@media (min-width: 768px) {
    body:not(.shared-view) { width: 420px; max-width: calc(100% - 24px); margin: 12px auto; padding: 8px; }
    body:not(.shared-view) .tabs { margin-bottom: 8px; gap: 4px; }
    body:not(.shared-view) .tab-btn { padding: 8px; font-size: 13px; }
    body:not(.shared-view) .card { padding: 12px; }
    body:not(.shared-view) .btn-clear { padding: 7px; margin-bottom: 10px; font-size: 12px; }
    body:not(.shared-view) .section-divider { height: 2px; margin: 9px 0; }
    body:not(.shared-view) .product { margin-bottom: 7px; font-size: 16px; }
    body:not(.shared-view) .product input[type="checkbox"] { width: 18px; height: 18px; margin-right: 8px; }
    body:not(.shared-view) .product-extra { width: 58px; min-width: 58px; max-width: 58px; height: 24px; margin-left: 6px; padding: 2px; font-size: 12px; }
    body:not(.shared-view) .add-custom { margin-top: 9px; }
    body:not(.shared-view) .add-custom input { padding: 7px; font-size: 13px; }
    body:not(.shared-view) .add-custom button { padding: 7px 10px; font-size: 13px; }
    body:not(.shared-view) .send-panel { margin-top: 14px; gap: 7px; }
    body:not(.shared-view) .btn-send,
    body:not(.shared-view) .btn-telegram,
    body:not(.shared-view) .btn-save { padding: 9px; font-size: 14px; border-radius: 5px; }
    body:not(.shared-view) textarea { height: 150px; padding: 8px; font-size: 14px; }
    body:not(.shared-view) .tg-input { padding: 7px; font-size: 13px; margin-bottom: 7px; }
    body:not(.shared-view) .hint { font-size: 12px; margin-bottom: 7px; }
}

</style>
</head>

<body>

<div class="tabs">
    <button id="btn-shopping-tab"
        class="tab-btn active"
        onclick="sw('shopping-tab', this)">
        🛒 Скласти список
    </button>

    <button id="btn-template-tab"
        class="tab-btn"
        onclick="sw('template-tab', this)">
        ⚙️ Редагувати шаблони
    </button>
</div>

<!-- СПИСОК ПОКУПОК -->

<div id="shopping-tab" class="tab-content active">

    <div class="card">

        <button class="btn-clear" onclick="cl()">
            🧹 Очистити всі галочки
        </button>

        <div id="tl1"></div>
        <div id="cl1"></div>

        <div class="add-custom">
            <input type="text" id="cn1"
                placeholder="Додати в першу секцію..."
                onkeydown="if(event.key==='Enter') ad(1)">
            <button onclick="ad(1)">+</button>
        </div>

        <hr class="section-divider">

        <div id="tl2"></div>
        <div id="cl2"></div>

        <div class="add-custom">
            <input type="text" id="cn2"
                placeholder="Додати в другу секцію..."
                onkeydown="if(event.key==='Enter') ad(2)">
            <button onclick="ad(2)">+</button>
        </div>

        <hr class="section-divider">

        <div id="tl3"></div>
        <div id="cl3"></div>

        <div class="add-custom">
            <input type="text" id="cn3"
                placeholder="Додати в третю секцію..."
                onkeydown="if(event.key==='Enter') ad(3)">
            <button onclick="ad(3)">+</button>
        </div>

    </div>

    <div class="send-panel">

        <button class="btn-telegram" id="telegramBtn"
            onclick="sendToTelegram()">
            ✈️ ВІДПРАВИТИ СПИСОК В ТЕЛЕГРАМ
        </button>

        <button class="btn-send" onclick="cp()">
            📋 ТІЛЬКИ СКОПІЮВАТИ ТЕКСТ
        </button>

    </div>
</div>

<!-- ПУБЛІЧНИЙ ПЕРЕГЛЯД СПИСКУ З ПОСИЛАННЯ -->
<div id="sharedListPage">
    <h1>🛒 СПИСОК ПОКУПОК</h1>
    <div id="sharedListContent"></div>
    <button type="button" onclick="copySharedList()">📋 СКОПІЮВАТИ СПИСОК</button>
</div>

<!-- НАЛАШТУВАННЯ -->

<div id="template-tab" class="tab-content">

    <div class="card">

        <div class="hint" style="color:#007bff">
            Налаштування Telegram-бота:
        </div>

        <input type="text" id="tg_token"
            class="tg-input"
            placeholder="Вставте ТОКЕН БОТА..."
            autocomplete="off">

        <input type="text" id="tg_chat"
            class="tg-input"
            placeholder="Вставте ВЛАСНИЙ CHAT ID..."
            autocomplete="off">

        <input type="url" id="tg_page_url"
            class="tg-input"
            placeholder="Адреса SHOPING на GitHub Pages (https://.../SHOPING.html)"
            autocomplete="url">
        <div class="hint">Ця адреса потрібна, щоб телефон відкривав готовий список окремою сторінкою.</div>

        <hr class="section-divider"
            style="height:1px;background:#eee">

        <div class="hint">
            Шаблони товарів (розділювач ---):
        </div>

        <textarea id="tt"></textarea>

        
<button class="btn-save" onclick="sv()">
    ЗБЕРЕГТИ ВСІ НАЛАШТУВАННЯ
</button>

<hr class="section-divider">

<div class="hint">Резервне копіювання налаштувань:</div>

<button class="btn-save"
    style="background:#007bff"
    onclick="createBackup()">
    💾 СТВОРИТИ БЕКАП
</button>

<button class="btn-save"
    style="background:#6c757d"
    onclick="document.getElementById('backupFile').click()">
    📂 ВІДНОВИТИ З БЕКАПУ
</button>

<input type="file"
    id="backupFile"
    accept=".json,application/json"
    style="display:none"
    onchange="restoreBackup(event)">


    </div>
</div>

<script>

// ЗБЕРЕЖЕННЯ НАЛАШТУВАНЬ

function ls(k, v) {
    if (v !== undefined) {
        localStorage.setItem(k, v);
    }
    return localStorage.getItem(k);
}

// ЗАВАНТАЖЕННЯ

window.onload = function() {

    if (!ls('st1')) {
        ls('st1',
`ХЛІБ
МОЛОКО
ЯЙЦЯ
---
МАСЛО
ЦУКОР
СІЛЬ
---
КАРТОПЛЯ
МОРКВА
ЦИБУЛЯ`);
    }

    $('tt').value = ls('st1');
    $('tg_token').value = ls('tg_tok') || '';
    $('tg_chat').value = ls('tg_cht') || '';
    $('tg_page_url').value = ls('tg_page_url') || '';

    re();
    showSharedListFromLink();
};

function $(id) {
    return document.getElementById(id);
}

// ПЕРЕМИКАННЯ ВКЛАДОК

function sw(id, btn) {

    $('shopping-tab').classList.remove('active');
    $('template-tab').classList.remove('active');

    $('btn-shopping-tab').classList.remove('active');
    $('btn-template-tab').classList.remove('active');

    $(id).classList.add('active');
    btn.classList.add('active');
}

// ЗБЕРЕЖЕННЯ

function sv() {

    ls('st1', $('tt').value);
    ls('tg_tok', $('tg_token').value.trim());
    ls('tg_cht', $('tg_chat').value.trim());
    ls('tg_page_url', $('tg_page_url').value.trim());

    re();

    alert('НАЛАШТУВАННЯ ЗБЕРЕЖЕНО!');

    sw('shopping-tab', $('btn-shopping-tab'));
}

// СТВОРЕННЯ ТОВАРІВ

function rd(num, lines) {

    let box = $('tl' + num);
    box.innerHTML = '';

    lines.forEach(function(line) {

        let t = line.trim().toUpperCase();

        if (t) {

            let d = document.createElement('div');
            d.className = 'product';

            let c = document.createElement('input');
            c.type = 'checkbox';
            c.value = t;

            d.appendChild(c);

            let name = document.createElement('span');
            name.className = 'product-name';
            name.textContent = t;
            d.appendChild(name);

            let extra = document.createElement('input');
            extra.type = 'text';
            extra.className = 'product-extra';
            extra.maxLength = 6;
            extra.placeholder = 'ДОД.';
            extra.title = 'Додаткова інформація (до 6 символів)';
            extra.setAttribute('aria-label', 'Додаткова інформація для ' + t);
            d.appendChild(extra);

            box.appendChild(d);
        }
    });

    $('cl' + num).innerHTML = '';
}

// ОНОВЛЕННЯ ШАБЛОНІВ

function re() {

    let parts = $('tt').value.split(/\r?\n---\r?\n/);

    rd(1, (parts[0] || '').split(/\r?\n/));
    rd(2, (parts[1] || '').split(/\r?\n/));
    rd(3, (parts[2] || '').split(/\r?\n/));
}

// ОЧИЩЕННЯ ГАЛОЧОК

function cl() {

    document.querySelectorAll('input[type="checkbox"]')
        .forEach(function(i) {
            i.checked = false;
        });

    $('cl1').innerHTML = '';
    $('cl2').innerHTML = '';
    $('cl3').innerHTML = '';
}

// ДОДАВАННЯ ВЛАСНОГО ТОВАРУ

function ad(num) {

    let input = $('cn' + num);
    let val = input.value.trim().toUpperCase();

    if (!val) return;

    let d = document.createElement('div');
    d.className = 'product';

    let c = document.createElement('input');
    c.type = 'checkbox';
    c.value = val;
    c.checked = true;

    d.appendChild(c);

    let name = document.createElement('span');
    name.className = 'product-name';
    name.textContent = val;
    d.appendChild(name);

    let extra = document.createElement('input');
    extra.type = 'text';
    extra.className = 'product-extra';
    extra.maxLength = 6;
    extra.placeholder = 'ДОД.';
    extra.title = 'Додаткова інформація (до 6 символів)';
    extra.setAttribute('aria-label', 'Додаткова інформація для ' + val);
    d.appendChild(extra);

    $('cl' + num).appendChild(d);

    input.value = '';
}

// ОТРИМАННЯ ВИБРАНИХ ТОВАРІВ

function gt(id) {

    let text = '';

    $(id).querySelectorAll('input[type="checkbox"]')
        .forEach(function(c) {

            if (c.checked) {
                let extra = c.parentElement.querySelector('.product-extra');
                let detail = extra ? extra.value.trim() : '';
                text += '- ' + c.value + (detail ? ' ' + detail : '') + '\n';
            }
        });

    return text;
}

// ФОРМУВАННЯ СПИСКУ

function buildListText() {

    let txt = '';

    let r1 = gt('tl1') + gt('cl1');
    let r2 = gt('tl2') + gt('cl2');
    let r3 = gt('tl3') + gt('cl3');

    if (r1) txt += r1;

    if (r2) {
        if (txt) txt += '-----------\n';
        txt += r2;
    }

    if (r3) {
        if (txt) txt += '-----------\n';
        txt += r3;
    }

    return txt.trim();
}

// КОПІЮВАННЯ

async function cp() {

    let txt = buildListText();

    if (!txt) {
        alert('ВИБЕРІТЬ ТОВАР!');
        return;
    }

    try {
        await navigator.clipboard.writeText(txt);
        alert('СКОПІЙОВАНО В БУФЕР ОБМІНУ!');
    } catch (e) {
        alert('НЕ ВДАЛОСЯ СКОПІЮВАТИ. ПЕРЕВІРТЕ ДОЗВІЛ БРАУЗЕРА.');
    }
}

// ВІДПРАВЛЕННЯ В TELEGRAM

async function sendToTelegram() {

    let txt = buildListText();
    if (!txt) {
        alert('ВИБЕРІТЬ ТОВАР!');
        return;
    }

    let token = ls('tg_tok');
    let chat = ls('tg_cht');
    let pageUrl = (ls('tg_page_url') || '').trim();

    if (!token || !chat) {
        alert('СПОЧАТКУ ЗАПОВНІТЬ ТОКЕН ТА CHAT ID!');
        sw('template-tab', $('btn-template-tab'));
        return;
    }

    if (!pageUrl) {
        alert('ДОДАЙТЕ АДРЕС SHOPING НА GITHUB PAGES У НАЛАШТУВАННЯХ!');
        sw('template-tab', $('btn-template-tab'));
        return;
    }

    let btn = $('telegramBtn');
    btn.disabled = true;
    btn.textContent = '⏳ ВІДПРАВЛЕННЯ...';

    try {
        // Кодуємо список у фрагмент URL: сервер GitHub Pages не отримує сам текст.
        const encoded = btoa(unescape(encodeURIComponent(txt)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        const shareUrl = new URL(pageUrl);
        shareUrl.hash = 'list=' + encoded;

        if (shareUrl.protocol !== 'https:') {
            throw new Error('АДРЕСА СТОРІНКИ МАЄ ПОЧИНАТИСЯ З HTTPS://');
        }

        const response = await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: chat,
                text: '🛒 ВАШ СПИСОК ПОКУПОК:\n' + shareUrl.toString(),
                disable_web_page_preview: true
            })
        });

        const result = await response.json();
        if (!response.ok || !result.ok) {
            throw new Error(result.description || 'Помилка Telegram API');
        }
        alert('✅ ПОСИЛАННЯ НА СПИСОК ВІДПРАВЛЕНО В TELEGRAM!');

    } catch (error) {
        console.error('Telegram error:', error);
        alert('❌ НЕ ВДАЛОСЯ ВІДПРАВИТИ!\n\n' + error.message + '\n\nПЕРЕВІРТЕ ТОКЕН, CHAT ID ТА АДРЕСУ GITHUB PAGES.');
    } finally {
        btn.disabled = false;
        btn.textContent = '✈️ ВІДПРАВИТИ СПИСОК В ТЕЛЕГРАМ';
    }
}

// ВІДКРИТТЯ СПИСКУ З ПОСИЛАННЯ НА ТЕЛЕФОНІ
let sharedListText = '';

function showSharedListFromLink() {
    const match = location.hash.match(/^#list=([A-Za-z0-9_-]+)$/);
    if (!match) return;
    try {
        let b64 = match[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        sharedListText = decodeURIComponent(escape(atob(b64)));
        $('sharedListContent').textContent = sharedListText;
        document.body.classList.add('shared-view');
        document.title = 'СПИСОК ПОКУПОК';
    } catch (e) {
        $('sharedListContent').textContent = 'НЕ ВДАЛОСЯ ПРОЧИТАТИ СПИСОК. ПЕРЕВІРТЕ ПОСИЛАННЯ.';
        document.body.classList.add('shared-view');
    }
}

async function copySharedList() {
    if (!sharedListText) return;
    try {
        await navigator.clipboard.writeText(sharedListText);
        alert('СПИСОК СКОПІЙОВАНО!');
    } catch (e) {
        alert('НЕ ВДАЛОСЯ СКОПІЮВАТИ СПИСОК.');
    }
}

// ===================================
// СТВОРЕННЯ РЕЗЕРВНОЇ КОПІЇ
// ===================================

function createBackup() {

    const backup = {
        app: "SHOPPING_LIST",
        version: 1,
        date: new Date().toISOString(),

        settings: {
            template: $('tt').value,
            telegram_token: $('tg_token').value.trim(),
            telegram_chat_id: $('tg_chat').value.trim(),
            telegram_page_url: $('tg_page_url').value.trim()
        }
    };

    const json = JSON.stringify(backup, null, 4);

    const blob = new Blob(
        [json],
        { type: 'application/json;charset=utf-8' }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');

    const date = new Date().toISOString()
        .slice(0, 10);

    a.href = url;
    a.download = 'shopping_backup_' + date + '.json';

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);

    alert('✅ БЕКАП УСПІШНО СТВОРЕНО!');
}


// ===================================
// ВІДНОВЛЕННЯ З РЕЗЕРВНОЇ КОПІЇ
// ===================================

function restoreBackup(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const backup = JSON.parse(e.target.result);

            // ПЕРЕВІРКА ФАЙЛУ

            if (
                backup.app !== 'SHOPPING_LIST' ||
                backup.version !== 1 ||
                !backup.settings ||
                typeof backup.settings.template !== 'string' ||
                typeof backup.settings.telegram_token !== 'string' ||
                typeof backup.settings.telegram_chat_id !== 'string'
            ) {
                throw new Error('НЕПРАВИЛЬНИЙ ФОРМАТ БЕКАПУ!');
            }

            // ПІДТВЕРДЖЕННЯ

            if (!confirm(
                'ВІДНОВИТИ НАЛАШТУВАННЯ З БЕКАПУ?\n\n' +
                'ПОТОЧНІ ШАБЛОНИ, ТОКЕН, CHAT ID ТА АДРЕСА СТОРІНКИ БУДУТЬ ЗАМІНЕНІ!'
            )) {
                return;
            }

            // ВІДНОВЛЕННЯ

            $('tt').value = backup.settings.template;

            $('tg_token').value =
                backup.settings.telegram_token;

            $('tg_chat').value =
                backup.settings.telegram_chat_id;
            $('tg_page_url').value = backup.settings.telegram_page_url || '';

            // ЗБЕРЕЖЕННЯ В LOCALSTORAGE

            ls('st1', backup.settings.template);

            ls('tg_tok', backup.settings.telegram_token);

            ls('tg_cht', backup.settings.telegram_chat_id);
            ls('tg_page_url', backup.settings.telegram_page_url || '');

            // ОНОВЛЕННЯ СПИСКУ

            re();

            alert(
                '✅ НАЛАШТУВАННЯ УСПІШНО ВІДНОВЛЕНО!\n\n' +
                'ШАБЛОНИ, ТОКЕН ТА CHAT ID ЗАВАНТАЖЕНІ.'
            );

            sw('shopping-tab', $('btn-shopping-tab'));

        } catch (error) {

            alert(
                '❌ ПОМИЛКА ВІДНОВЛЕННЯ!\n\n' +
                error.message
            );

        } finally {

            // ДОЗВОЛЯЄ ВИБРАТИ ТОЙ САМИЙ ФАЙЛ ПОВТОРНО

            event.target.value = '';

        }
    };

    reader.onerror = function() {

        alert('НЕ ВДАЛОСЯ ПРОЧИТАТИ ФАЙЛ!');

        event.target.value = '';

    };

    reader.readAsText(file);

}

</script>

</html>
